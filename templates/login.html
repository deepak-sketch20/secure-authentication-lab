{% extends "base.html" %}{% block title %}Sign in · SecureLab{% endblock %}
{% block content %}
<section class="card">
  <div class="eyebrow">SECURE ACCESS</div><h1>Welcome back</h1><p class="muted">Sign in to your local lab account.</p>
  <form method="post" action="{{ url_for('login') }}">
    <label>Username<input name="username" autocomplete="username" minlength="3" maxlength="30" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
    <button type="submit">Sign in securely</button>
  </form>
  <p class="bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
